---
services:
  api-for-monitoring:
    build:
      context: api
    container_name: api-for-monitoring
    restart: unless-stopped
    environment:
      BASE_ROUTE_PATH: ${BASE_ROUTE_PATH}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    networks:
      - monitoring-example
    healthcheck:
      test: curl -f -s -S -o /dev/null http://localhost:8000/api/v1/app-info/versions || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      api-for-monitoring:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${COMPOSE_MAPPING_PORT-80}:80"
    networks:
      - monitoring-example
    healthcheck:
      test: nginx -t || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=240h'  # 10 days of history
      - '--web.enable-lifecycle'
    networks:
      - monitoring-example
#    extra_hosts:
#      - "host.docker.internal:host-gateway"  # for accessing server apps

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
#      - GF_SERVER_ROOT_URL=/grafana  # for nginx reverse proxy
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
#      - GF_AUTH_ANONYMOUS_ENABLED=true  # for no pass login
#      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - monitoring-example

networks:
  monitoring-example:

volumes:
  prometheus_data:
  grafana_data:
