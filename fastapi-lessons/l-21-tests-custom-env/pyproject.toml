[project]
name = "l-21-tests-custom-env"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
package-mode = false
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "psycopg (>=3.2.9,<4.0.0)",
]

[tool.poetry.group.test.dependencies]
flake8 = "^7.3.0"
pep8-naming = "^0.15.1"
flake8-pyproject = "^1.2.3"
pytest = "^9.0.1"
asyncio = "^4.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
pytest-ordering = "^0.6"
pytest-asyncio = "^1.3.0"
pytest-dotenv = "^0.5.2"
httpx = "^0.28.1"
isort = "^7.0.0"
aiosqlite = "^0.22.1"


[tool.flake8]
max-line-length = 120
ignore = [
    # W503: line break before binary operator
    "W503"
]
exclude = [
    ".git",
    "__pycache__",
    "conf",
    "venv",
    ".venv",
    ".vscode",
    ".idea",
]
per-file-ignores = [
    "migrations/env.py:F401",
    "migrations/versions/*:W291",
]


[tool.pytest.ini_options]
#filterwarnings = "ignore::DeprecationWarning:^(?!node\\.).*:"
pythonpath = ". src"
minversion = "8.0"
addopts = [
    "--strict",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=10",
    "--cov=.",
]
env_files = ['.test.env']


#[pytest]
#env_override_existing_values = 1
#env_files = [
##    '.env',
#    '.test.env',
#]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
