[tool.poetry]
name = "l-28-redis-pub-sub-subscriber"
version = "0.1.0"
description = ""
authors = ["author"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pydantic-settings = "^2.10.1"
redis = "^7.1.0"
asyncio = "^4.0.0"

[tool.poetry.group.test.dependencies]
isort = "^7.0.0"
flake8 = "^7.3.0"
pep8-naming = "^0.15.1"
flake8-pyproject = "^1.2.4"


[tool.flake8]
max-line-length = 120
ignore = [
    # W503: line break before binary operator
    "W503"
]
exclude = [
    ".git",
    "__pycache__",
    "conf",
    "venv",
    ".venv",
    ".vscode",
    ".idea",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

