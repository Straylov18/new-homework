services:
  redis-master:
    image: redis:8.0-alpine
    container_name: redis-master
    hostname: redis-master
    ports:
      - "6389:6379"  # на случай, если у тебя на машине уже стоит redis, чтобы с ним не конфликтовать
    volumes:
      - ./redis-master.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica1:
    image: redis:8.0-alpine
    container_name: redis-replica1
    hostname: redis-replica1
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./redis-replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDIS_REPLICATION_MODE: "replica"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica2:
    image: redis:8.0-alpine
    container_name: redis-replica2
    hostname: redis-replica2
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./redis-replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDIS_REPLICATION_MODE: "replica"
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-sentinel:
    image: redis:8.0-alpine
    deploy:
      replicas: 3
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "26379-26381:26379"
    volumes:
      - ./sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: ["redis-server", "/usr/local/etc/redis/sentinel.conf", "--sentinel"]
    networks:
      - redis-sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

