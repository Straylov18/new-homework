services:
  # Очередь задач и хранилище результатов для ARQ (тот же Redis).
  redis:
    image: redis:8-alpine
    container_name: l-32-arq-redis
    restart: unless-stopped
    # command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "6381:6379"
    networks:
      - redis-arq-net
    healthcheck:
      # Redis защищён паролем (--requirepass), поэтому пинг должен
      # аутентифицироваться, иначе healthcheck будет падать с NOAUTH.
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # FastAPI-приложение: кладёт задачи в очередь.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l-32-arq-api
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      REDIS_SERVER: ${REDIS_SERVER-redis}
      REDIS_PORT: ${REDIS_PORT-6379}
      REDIS_DB: ${REDIS_DB-0}
      # REDIS_USER: ${REDIS_USER-master}
      # REDIS_PASSWORD: ${REDIS_PASSWORD-master}
      EMAIL_LOG_FILE: ${EMAIL_LOG_FILE-/app/data/mail.log}
    ports:
      - "8000:8000"
    volumes:
      # Монтируем код, чтобы --reload подхватывал изменения
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - redis-arq-net

  # ARQ worker: выполняет задачи (отправку писем) в фоне.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l-32-arq-worker
    restart: unless-stopped
    command: arq src.arq_app.WorkerSettings
    environment:
      REDIS_SERVER: ${REDIS_SERVER-redis}
      REDIS_PORT: ${REDIS_PORT-6379}
      REDIS_DB: ${REDIS_DB-0}
      # REDIS_USER: ${REDIS_USER-master}
      # REDIS_PASSWORD: ${REDIS_PASSWORD-master}
      EMAIL_LOG_FILE: ${EMAIL_LOG_FILE-/app/data/mail.log}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - redis-arq-net
    depends_on:
      redis:
        condition: service_healthy

networks:
  redis-arq-net:
    driver: bridge
    name: redis-arq-net
